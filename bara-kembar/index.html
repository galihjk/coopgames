// =====================================================================
//  BARA KEMBAR — co-op souls-like, 2 pemain 1 perangkat, tampilan atas

// ---------- util ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const turnTo = (c, t, m) => c + clamp(angDiff(c, t), -m, m);
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } }

// ---------- canvas / orientasi ----------

const lightCv = document.createElement('canvas');
const lctx = lightCv.getContext('2d');

const LEASH = { x: 600, y: 340 };
let ZMIN = .6, ZMAX = 1.2;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = innerWidth; SH = innerHeight;
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
  portrait = SH > SW;
  W = portrait ? SH : SW; H = portrait ? SW : SH;
  U = Math.min(H / 400, W / 750);
  lightCv.width = Math.ceil(W / 2); lightCv.height = Math.ceil(H / 2);
  ZMAX = H / (T * 5.8); ZMIN = H / (T * 10.5);
  LEASH.x = W * .6 / ZMIN - 170; LEASH.y = H * .8 / ZMIN - 150;
  layoutControls();
}
function baseT() {
  if (portrait) ctx.setTransform(0, DPR, -DPR, 0, SW * DPR, 0);
  else ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function toL(cx, cy) { return portrait ? { x: cy, y: SW - cx } : { x: cx, y: cy }; }
// bingkai baca per pemain: P1 duduk di sisi kiri layar, P2 di sisi kanan (berhadapan)
function inFrame(i, fn) {
  ctx.save();
  if (i === 0) { ctx.translate(W, 0); ctx.rotate(Math.PI / 2); }
  else { ctx.translate(0, H); ctx.rotate(-Math.PI / 2); }
  fn(H, W);
  ctx.restore();
}
function screenToFrame(i, q) { return i === 0 ? { x: q.y, y: W - q.x } : { x: H - q.y, y: q.x }; }

// =====================================================================
//  AUDIO (WebAudio sintetis)
// =====================================================================
const Snd = (() => {
  let ac = null, out, nb, drone, droneG, musicG;
  function init() {
    if (ac) { if (ac.state !== 'running') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    out = ac.createGain(); out.gain.value = .6;
    const comp = ac.createDynamicsCompressor(); out.connect(comp); comp.connect(ac.destination);
    nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // drone ambient
    droneG = ac.createGain(); droneG.gain.value = .035;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    [55, 55.5, 82.4].forEach(f => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); });
    lp.connect(droneG); droneG.connect(out);
    musicG = ac.createGain(); musicG.gain.value = .0; musicG.connect(out);
  }
  function env(g, t, a, v, d) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + d); }
  function tone(f, d, type = 'sine', v = .2, f2 = 0, delay = 0, dest) {
    if (!ac) return; const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    env(g, t, .006, v, d); o.connect(g); g.connect(dest || out); o.start(t); o.stop(t + d + .05);
  }
  function noise(d, v, f, type = 'lowpass', q = 1, f2 = 0, delay = 0) {
    if (!ac) return; const t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
    const g = ac.createGain(); env(g, t, .005, v, d);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random() * .5); s.stop(t + d + .05);
  }
  let musicOn = false;
  return {
    init,
    get ok() { return !!ac; },
    swing: () => noise(.16, .22, 700, 'bandpass', 1.4, 2800),
    swingHeavy: () => { noise(.26, .3, 400, 'bandpass', 1.2, 2000); },
    hit: () => { tone(160, .12, 'square', .12, 50); noise(.08, .3, 1800, 'lowpass'); },
    crit: () => { tone(90, .4, 'sawtooth', .2, 40); noise(.3, .4, 3000, 'lowpass', 1, 300); tone(1200, .25, 'triangle', .08, 600); },
    parry: () => { tone(1500, .35, 'triangle', .18, 1450); tone(2250, .3, 'sine', .12); noise(.06, .3, 6000, 'highpass'); },
    block: () => { tone(260, .12, 'square', .08, 180); noise(.1, .25, 2500, 'bandpass', 2); },
    guardBreak: () => { tone(140, .4, 'sawtooth', .18, 60); noise(.3, .3, 1500, 'bandpass'); },
    hurt: () => { tone(220, .2, 'sawtooth', .12, 80); noise(.12, .3, 900); },
    bow: () => { tone(320, .12, 'triangle', .14, 140); noise(.08, .15, 3000, 'highpass'); },
    bowFull: () => { tone(500, .15, 'triangle', .14, 200); noise(.12, .2, 4000, 'highpass'); },
    arrowHit: () => { noise(.05, .2, 2500, 'bandpass', 3); },
    roll: () => noise(.25, .15, 500, 'lowpass', 1, 150),
    heal: () => { [523, 659, 784].forEach((f, i) => tone(f, .35, 'sine', .08, 0, i * .08)); },
    swap: () => { tone(800, .05, 'square', .05); tone(500, .06, 'square', .05, 0, .07); },
    tele: () => tone(540, .12, 'sine', .05, 700),
    bossTele: () => { tone(110, .4, 'sawtooth', .07, 160); },
    slam: () => { tone(70, .6, 'sine', .4, 28); noise(.5, .4, 600, 'lowpass', 1, 80); },
    roar: () => { tone(95, 1.2, 'sawtooth', .22, 55); tone(140, 1.1, 'sawtooth', .12, 70); noise(1.1, .3, 900, 'bandpass', .7, 200); },
    fire: () => { noise(.3, .18, 1200, 'bandpass', .8, 300); },
    pillar: () => { tone(60, .5, 'sine', .3, 30); noise(.5, .35, 2000, 'lowpass', .7, 200); },
    die: () => { tone(300, .5, 'triangle', .1, 60); noise(.3, .2, 800); },
    enemyDie: () => { noise(.3, .2, 1200, 'lowpass', 1, 200); tone(200, .3, 'sine', .06, 70); },
    bonfire: () => { noise(1.2, .2, 300, 'lowpass', 1, 1800); [392, 523, 659].forEach((f, i) => tone(f, .9, 'sine', .06, 0, .1 + i * .15)); },
    fog: () => noise(1, .15, 3000, 'bandpass', .5, 600),
    portal: () => { [440, 554, 659, 880].forEach((f, i) => tone(f, .6, 'sine', .07, 0, i * .1)); },
    fail: () => tone(150, .08, 'square', .05),
    chain: () => tone(1800, .05, 'sine', .04),
    over: () => { [220, 207, 174].forEach((f, i) => tone(f, 1.6, 'sawtooth', .07, f * .7, i * .25)); noise(2, .1, 400); },
    victory: () => { [262, 330, 392, 523, 659].forEach((f, i) => tone(f, 2.2, 'triangle', .07, 0, i * .12)); },
    music(on) { musicOn = on; if (ac) { musicG.gain.setTargetAtTime(on ? .5 : 0, ac.currentTime, .5); droneG.gain.setTargetAtTime(on ? .05 : .035, ac.currentTime, .5); } },
    beat(n) {
      if (!ac || !musicOn) return;
      tone(55, .35, 'sine', .35, 35, 0, musicG);
      if (n % 2 === 1) noise(.06, .08, 4000, 'highpass');
      const seq = [220, 0, 261.6, 0, 246.9, 0, 207.6, 196];
      const f = seq[n % 8]; if (f) tone(f, .5, 'sawtooth', .025, 0, 0, musicG);
    }
  };
})();

// =====================================================================
//  INPUT
// =====================================================================
const IN = [0, 1].map(() => ({ mx: 0, my: 0, tb: [0, 0, 0], kb: [0, 0, 0], h: [0, 0, 0], pv: [0, 0, 0], joy: null, kx: { u: 0, d: 0, l: 0, r: 0 } }));
const pressed = (i, k) => IN[i].h[k] && !IN[i].pv[k];
const released = (i, k) => !IN[i].h[k] && IN[i].pv[k];
const ctrls = [{}, {}];
function layoutControls() {
  const u = U;
  for (let i = 0; i < 2; i++) {
    const m = (x, y) => i === 0 ? { x, y } : { x: W - x, y: H - y };
    const c = ctrls[i];
    c.joy = Object.assign(m(110 * u, 100 * u), { r: 70 * u });
    c.b = [Object.assign(m(95 * u, 250 * u), { r: 42 * u }), Object.assign(m(95 * u, 342 * u), { r: 40 * u }), Object.assign(m(170 * u, 296 * u), { r: 29 * u })];
  }
}
const KEYMAP = {
  KeyW: [0, 'u'], KeyS: [0, 'd'], KeyA: [0, 'l'], KeyD: [0, 'r'], KeyF: [0, 0], KeyG: [0, 1], KeyH: [0, 2],
  ArrowUp: [1, 'u'], ArrowDown: [1, 'd'], ArrowLeft: [1, 'l'], ArrowRight: [1, 'r'],
  Numpad1: [1, 0], Numpad2: [1, 1], Numpad3: [1, 2], Comma: [1, 0], Period: [1, 1], Slash: [1, 2],
};
addEventListener('keydown', e => {
  Snd.init();
  if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); return; }
  if (G.mode === 'title' && (e.code === 'Enter' || e.code === 'Space')) { startGame(0); return; }
  if (G.mode === 'title' && e.code === 'Digit2') { startGame(1); return; }
  if (G.mode === 'win' && e.code === 'Enter') { G.mode = 'title'; return; }
  const m = KEYMAP[e.code]; if (!m) return; e.preventDefault();
  if (typeof m[1] === 'number') IN[m[0]].kb[m[1]] = 1; else IN[m[0]].kx[m[1]] = 1;
});
addEventListener('keyup', e => {
  const m = KEYMAP[e.code]; if (!m) return;
  if (typeof m[1] === 'number') IN[m[0]].kb[m[1]] = 0; else IN[m[0]].kx[m[1]] = 0;
});
const ptrs = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init();
  const q = toL(e.clientX, e.clientY);
  if (G.mode !== 'play') { uiTap(q); return; }
  if (Math.hypot(q.x - W / 2, q.y - 20 * U) < 26 * U) { togglePause(); return; }
  const a = assignTouch(q);
  if (a) { ptrs.set(e.pointerId, a); try { cv.setPointerCapture(e.pointerId); } catch (er) { } }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  const a = ptrs.get(e.pointerId); if (!a || a.kind !== 'joy') return;
  const q = toL(e.clientX, e.clientY), j = IN[a.i].joy; if (!j) return;
  j.x = q.x; j.y = q.y;
  const r = ctrls[a.i].joy.r;
  let dx = (j.x - j.bx) / r, dy = (j.y - j.by) / r; const l = Math.hypot(dx, dy);
  if (l > 1) { // base ikut terseret supaya tidak "mentok"
    j.bx += (dx / l) * (l - 1) * r; j.by += (dy / l) * (l - 1) * r; dx /= l; dy /= l;
  }
  j.dx = dx; j.dy = dy;
}, { passive: false });
function endPtr(e) {
  const a = ptrs.get(e.pointerId); if (!a) return; ptrs.delete(e.pointerId);
  if (a.kind === 'joy') IN[a.i].joy = null; else IN[a.i].tb[a.k] = 0;
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
function assignTouch(q) {
  let best = null, bd = 1e9;
  for (let i = 0; i < 2; i++) for (let k = 0; k < 3; k++) {
    const b = ctrls[i].b[k], d = Math.hypot(q.x - b.x, q.y - b.y);
    if (d < b.r * 1.45 && d / b.r < bd) { bd = d / b.r; best = { i, kind: 'b', k }; }
  }
  if (best) { IN[best.i].tb[best.k] = 1; return best; }
  for (let i = 0; i < 2; i++) {
    const inZone = i === 0 ? (q.x < W * .33 && q.y < H * .58) : (q.x > W * .67 && q.y > H * .42);
    if (inZone && !IN[i].joy) { IN[i].joy = { bx: q.x, by: q.y, x: q.x, y: q.y, dx: 0, dy: 0 }; return { i, kind: 'joy' }; }
  }
  return null;
}
function pollInput() {
  for (const n of IN) {
    for (let k = 0; k < 3; k++) n.h[k] = n.tb[k] || n.kb[k] ? 1 : 0;
    let mx = n.kx.r - n.kx.l, my = n.kx.d - n.kx.u;
    if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
    if (n.joy) { mx = n.joy.dx; my = n.joy.dy; }
    n.mx = mx; n.my = my;
  }
}
function endInput() { for (const n of IN) for (let k = 0; k < 3; k++) n.pv[k] = n.h[k]; }

// =====================================================================
//  STATE GLOBAL
// =====================================================================
const G = { mode: 'title', t: 0, banners: [], hitStop: 0, slowT: 0, shake: 0, fade: 0, fadeDir: 0, fadeCb: null, overT: 0, hintT: 0, beatT: 0, beatN: 0, winT: 0, fx: [] };
let L = null;
const cam = { x: 0, y: 0, z: 1 };
const players = [];

function banner(text, sub, dur = 3, color = '#e8d9b0', big = true) { G.banners.push({ text, sub, t: 0, dur, color, big }); }
function msg(p, text, dur = 2.5) { p.msg = { text, t: 0, dur }; }
function hitStop(s) { G.hitStop = Math.max(G.hitStop, s); }
function shake(s) { G.shake = Math.max(G.shake, s); }

// =====================================================================
//  LEVEL
// =====================================================================
function loadLevel(idx) {
  const def = LEVELS[idx], rows = def.map;
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const grid = new Uint8Array(w * h);
  const lv = { idx, def, w, h, grid, spawns: [], bonfires: [], gates: [], start: null, bossSpawn: null, gateState: 'fog', bossState: 'dormant', enemies: [], projectiles: [], hazards: [], particles: [], decals: [], portal: null, fields: [null, null], fieldT: 0, boss: null, gateHintT: 0 };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x] || '#', c = { x: (x + .5) * T, y: (y + .5) * T };
    grid[y * w + x] = ch === '#' ? 1 : ch === 'F' ? 2 : 0;
    if (ch === 'F') lv.gates.push(c);
    if (ch === 'S') lv.start = c;
    if (ch === 'B') lv.bonfires.push(Object.assign(c, { lit: false, r: 14 }));
    if ('gab'.includes(ch)) lv.spawns.push({ type: { g: 'grunt', a: 'archer', b: 'brute' }[ch], x: c.x, y: c.y });
    if (ch === 'X') lv.bossSpawn = c;
  }
  // area arena = flood fill dari X (gerbang & dinding membatasi)
  lv.arena = new Uint8Array(w * h);
  const q = [[Math.floor(lv.bossSpawn.x / T), Math.floor(lv.bossSpawn.y / T)]];
  lv.arena[q[0][1] * w + q[0][0]] = 1; lv.arenaTiles = [];
  while (q.length) {
    const [x, y] = q.shift(); lv.arenaTiles.push({ x: (x + .5) * T, y: (y + .5) * T });
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const k = ny * w + nx; if (grid[k] || lv.arena[k]) continue; lv.arena[k] = 1; q.push([nx, ny]);
    }
  }
  lv.checkpoint = lv.start;
  L = lv;
  L.cv = prerenderLevel();
  populate();
  placePlayers(L.start, true);
  cam.x = L.start.x; cam.y = L.start.y; cam.z = (ZMIN + ZMAX) / 2;
}
function populate() {
  L.enemies = L.spawns.map(s => makeEnemy(s.type, s.x, s.y));
  if (L.bossState !== 'dead') { L.boss = makeEnemy(L.def.boss, L.bossSpawn.x, L.bossSpawn.y); L.enemies.push(L.boss); }
  L.projectiles = []; L.hazards = [];
}
function placePlayers(c, full) {
  players.forEach((p, i) => {
    const off = [[-18, -10], [18, 10]][i];
    let x = c.x + off[0], y = c.y + off[1];
    if (tileSolidW(x, y)) { x = c.x; y = c.y; }
    p.spawn(x, y);
  });
}
function tileSolid(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= L.w || ty >= L.h) return true;
  const v = L.grid[ty * L.w + tx];
  return v === 1 || (v === 2 && L.gateState !== 'open');
}
const tileSolidW = (x, y) => tileSolid(Math.floor(x / T), Math.floor(y / T));
const inArena = o => { const tx = Math.floor(o.x / T), ty = Math.floor(o.y / T); return tx >= 0 && ty >= 0 && tx < L.w && ty < L.h && L.arena[ty * L.w + tx] === 1; };

function resolveCircle(o) {
  const r = o.r; let hit = false;
  const x0 = Math.floor((o.x - r) / T), x1 = Math.floor((o.x + r) / T), y0 = Math.floor((o.y - r) / T), y1 = Math.floor((o.y + r) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (!tileSolid(tx, ty)) continue;

        if (m === l) o.x = tx * T - r; else if (m === rr) o.x = tx * T + T + r; else if (m === t) o.y = ty * T - r; else o.y = ty * T + T + r;

}
function moveCircle(o, dx, dy) {

}

function computeFields() {
  for (const p of players) {
    const f = new Int16Array(L.w * L.h).fill(-1);

      const sx = Math.floor(p.x / T), sy = Math.floor(p.y / T), q = [sx + sy * L.w]; f[q[0]] = 0; let qi = 0;
      while (qi < q.length) {

// ---------- prerender peta ----------
function prerenderLevel() {
  const c = document.createElement('canvas'); c.width = L.w * T; c.height = L.h * T;
  const g = c.getContext('2d');
  let seed = 1337 + L.idx * 99; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const [fr, fg, fb] = L.def.floor, [wr, wg, wb] = L.def.wall;
  const solid = (x, y) => x < 0 || y < 0 || x >= L.w || y >= L.h || L.grid[y * L.w + x] === 1;
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const px = x * T, py = y * T;
    if (!solid(x, y)) {
      const v = rnd() * 10 - 5;
      g.fillStyle = `rgb(${fr + v},${fg + v},${fb + v})`; g.fillRect(px, py, T, T);
      g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1.5;
      g.strokeRect(px + .75, py + .75, T - 1.5, T - 1.5);
      if (rnd() < .5) { g.beginPath(); if (rnd() < .5) { g.moveTo(px + T / 2, py); g.lineTo(px + T / 2, py + T); } else { g.moveTo(px, py + T / 2); g.lineTo(px + T, py + T / 2); } g.stroke(); }
      if (rnd() < .25) { // retakan
        g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1; g.beginPath();
        let cx = px + rnd() * T, cy = py + rnd() * T; g.moveTo(cx, cy);
        for (let k = 0; k < 4; k++) { cx += rnd() * 14 - 7; cy += rnd() * 14 - 7; g.lineTo(cx, cy); } g.stroke();
      }
      if (rnd() < .07) { // tulang/puing
        g.strokeStyle = 'rgba(200,190,170,.25)'; g.lineWidth = 2; g.beginPath();
        const cx = px + 10 + rnd() * 28, cy = py + 10 + rnd() * 28, a = rnd() * TAU;
        g.moveTo(cx - Math.cos(a) * 6, cy - Math.sin(a) * 6); g.lineTo(cx + Math.cos(a) * 6, cy + Math.sin(a) * 6); g.stroke();
      }
      // AO di tepi dinding
      const ao = (x0, y0, x1, y1) => { const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; };
      const A = 16;
      if (solid(x, y - 1)) { ao(0, py, 0, py + A); g.fillRect(px, py, T, A); }
      if (solid(x, y + 1)) { ao(0, py + T, 0, py + T - A); g.fillRect(px, py + T - A, T, A); }
      if (solid(x - 1, y)) { ao(px, 0, px + A, 0); g.fillRect(px, py, A, T); }
      if (solid(x + 1, y)) { ao(px + T, 0, px + T - A, 0); g.fillRect(px + T - A, py, A, T); }
    } else {
      const v = rnd() * 8 - 4;
      g.fillStyle = `rgb(${wr + v},${wg + v},${wb + v})`; g.fillRect(px, py, T, T);
      g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1.5;
      for (let r = 0; r < 3; r++) { // bata
        const yy = py + r * 16; g.beginPath(); g.moveTo(px, yy); g.lineTo(px + T, yy); g.stroke();
        const off = (r % 2) * 12; for (let k = off; k < T; k += 24) { g.beginPath(); g.moveTo(px + k, yy); g.lineTo(px + k, yy + 16); g.stroke(); }
      }
      g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.75)';
      if (!solid(x, y - 1)) { g.beginPath(); g.moveTo(px, py + 2); g.lineTo(px + T, py + 2); g.stroke(); }
      if (!solid(x, y + 1)) { g.beginPath(); g.moveTo(px, py + T - 2); g.lineTo(px + T, py + T - 2); g.stroke(); }
      if (!solid(x - 1, y)) { g.beginPath(); g.moveTo(px + 2, py); g.lineTo(px + 2, py + T); g.stroke(); }
      if (!solid(x + 1, y)) { g.beginPath(); g.moveTo(px + T - 2, py); g.lineTo(px + T - 2, py + T); g.stroke(); }
    }
  }
  // lingkaran ritual di arena bos
  const b = L.bossSpawn; g.strokeStyle = 'rgba(160,40,30,.22)'; g.lineWidth = 3;
  for (const r of [70, 130]) { g.beginPath(); g.arc(b.x, b.y, r, 0, TAU); g.stroke(); }
  for (let k = 0; k < 8; k++) { const a = k / 8 * TAU; g.beginPath(); g.moveTo(b.x + Math.cos(a) * 70, b.y + Math.sin(a) * 70); g.lineTo(b.x + Math.cos(a) * 130, b.y + Math.sin(a) * 130); g.stroke(); }
  return c;
}

// =====================================================================
//  PEMAIN
// =====================================================================
const SPD = 112;
const COMBO = [
  { wind: .20, act: .10, rec: .42, dmg: 20, cost: 20, range: 50, arc: 2.1, lunge: 110, sw: [-1.2, 1.2] },
  { wind: .15, act: .10, rec: .48, dmg: 24, cost: 22, range: 52, arc: 2.1, lunge: 120, sw: [1.2, -1.2] },
  { wind: .32, act: .13, rec: .70, dmg: 38, cost: 28, range: 58, arc: 2.8, lunge: 170, sw: [-1.6, 1.6], heavy: true },
];
const CHAIN_WIN = .24, PARRY_WIN = .2, HEAL_AMT = 45, MAX_FLASK = 3;

class Player {
  constructor(i) {
    this.i = i; this.r = 12; this.maxHp = 100; this.maxStam = 100;
    this.col = i ? '#62d6cf' : '#f2ad4e'; this.glow = i ? '98,214,207' : '242,173,78';
    this.weapon = i ? 'bow' : 'sword';
  }
  spawn(x, y) {
    Object.assign(this, {
      x, y, kx: 0, ky: 0, hp: this.maxHp, hpLag: this.maxHp, stam: this.maxStam, stamCd: 0, flasks: MAX_FLASK,
      state: 'free', st: 0, face: this.i ? Math.PI : 0, combo: 0, chainLock: false, hitSet: null, blockT: 0, drawT: 0,
      relPending: false, iframe: 1, flash: 0, down: false, dead: false, downT: 0, revT: 0, b3T: -1, healDone: false,
      rollA: 0, walk: 0, moving: 0, stagDur: 0, msg: null, swapHint: 0, parryFx: 0
    });
  }
  get alive() { return !this.down && !this.dead; }
}
players.push(new Player(0), new Player(1));

function sepVal(a, b) { const dx = (a.x - b.x) / LEASH.x, dy = (a.y - b.y) / LEASH.y; return dx * dx + dy * dy; }
function movePlayer(p, dx, dy) {
  const q = players[1 - p.i];
  if (q.dead) { moveCircle(p, dx, dy); return; }
  const before = sepVal(p, q);
  const ox = p.x, oy = p.y;
  moveCircle(p, dx, dy);
  const after = sepVal(p, q);
  if (after > 1 && after > before) {
    p.x = ox; p.y = oy; moveCircle(p, dx, 0);
    let v = sepVal(p, q); if (v > 1 && v > before) { p.x = ox; p.y = oy; }
    const mx = p.x, my = p.y; moveCircle(p, 0, dy);
    v = sepVal(p, q); if (v > 1 && v > before) { p.x = mx; p.y = my; }
    if (!p.msg || p.msg.t > 1) msg(p, 'Jangan terlalu jauh dari rekanmu', 1.2);
  }
}
function targetables() { return L.enemies.filter(e => !e.dead && !(e.boss && L.bossState !== 'active') && !e.inv); }
function aimAssist(p, ang, cone, range) {
  let best = null, bs = 1e9;
  for (const e of targetables()) {
    const d = dist(p, e); if (d > range) continue;
    const da = Math.abs(angDiff(ang, angTo(p, e))); if (da > cone) continue;
    if (!los(p, e)) continue;
    const s = da * 220 + d; if (s < bs) { bs = s; best = e; }
  }
  return best ? angTo(p, best) : ang;
}
function startAttack(p, c) {
  if (p.stam <= 0) { Snd.fail(); msg(p, 'Stamina habis', .8); return false; }
  const a = COMBO[c]; p.combo = c; p.state = 'atk_w'; p.st = 0; p.stam -= a.cost; p.stamCd = .65;
  p.face = aimAssist(p, p.face, 1.0, 110); p.hitSet = new Set(); p.chainLock = false;
  if (p.stam < 0) p.stam = 0;
  return true;
}
function startRoll(p, mx, my, m) {
  if (p.stam <= 0) { Snd.fail(); msg(p, 'Stamina habis', .8); return; }
  p.stam = Math.max(0, p.stam - 22); p.stamCd = .6;
  p.rollA = m > .3 ? Math.atan2(my, mx) : p.face; p.face = p.rollA;
  p.state = 'roll'; p.st = 0; Snd.roll();
}
function fireArrow(p) {
  const ch = clamp((p.drawT - .28) / .62, 0, 1), full = ch >= 1;
  const ang = aimAssist(p, p.face, .45, 460); p.face = ang;
  p.stam = Math.max(0, p.stam - (8 + 8 * ch)); p.stamCd = .55;
  spawnProj('p', p.x + Math.cos(ang) * 16, p.y + Math.sin(ang) * 16, ang, full ? 720 : 470 + 150 * ch, 10 + 20 * ch, { kind: 'arrow', pierce: full ? 3 : 0, life: 1.1, r: 4, full, src: p });
  full ? Snd.bowFull() : Snd.bow();
  p.state = 'shoot_r'; p.st = 0;
}

function updatePlayer(p, dt) {
  if (p.dead) return;
  const inp = IN[p.i];
  p.flash = Math.max(0, p.flash - dt); p.iframe = Math.max(0, p.iframe - dt); p.parryFx = Math.max(0, p.parryFx - dt);
  p.hpLag = p.hpLag > p.hp ? Math.max(p.hp, p.hpLag - 30 * dt) : p.hp;
  if (p.msg) { p.msg.t += dt; if (p.msg.t > p.msg.dur) p.msg = null; }
  if (p.swapHint > 0) p.swapHint -= dt;
  if (p.kx || p.ky) {
    moveCircle(p, p.kx * dt, p.ky * dt); const f = Math.pow(.0015, dt); p.kx *= f; p.ky *= f;
    if (Math.hypot(p.kx, p.ky) < 6) p.kx = p.ky = 0;
  }
  if (p.state === 'down') return;
  // stamina
  if (p.stamCd > 0) p.stamCd -= dt;
  else if (p.stam < p.maxStam) {
    const rate = p.state === 'block' ? 14 : p.state === 'draw' ? 22 : 44;
    p.stam = Math.min(p.maxStam, p.stam + rate * dt);
  }
  const mag = Math.hypot(inp.mx, inp.my), m = mag > .2 ? Math.min(1, mag) : 0;
  const mAng = Math.atan2(inp.my, inp.mx);
  p.st += dt; p.moving = 0;
  const walk = (spd, turn) => {
    if (m > 0) {
      p.face = turnTo(p.face, mAng, turn * dt);
      movePlayer(p, Math.cos(mAng) * spd * m * dt, Math.sin(mAng) * spd * m * dt);
      p.walk += spd * m * dt * .11; p.moving = m;
    }
  };
  switch (p.state) {
    case 'free': {
      walk(SPD, 16);
      if (pressed(p.i, 0)) { if (p.weapon === 'sword') startAttack(p, 0); else if (p.stam > 0) { p.state = 'draw'; p.st = 0; p.drawT = 0; p.relPending = false; } else { Snd.fail(); msg(p, 'Stamina habis', .8); } }
      else if (p.weapon === 'sword' && inp.h[1]) { p.state = 'block'; p.st = 0; p.blockT = 0; }
      else if (p.weapon === 'bow' && pressed(p.i, 1)) startRoll(p, inp.mx, inp.my, m);
      // tombol 3: ketuk = ganti senjata, tahan = minum ramuan
      if (p.state === 'free') {
        if (pressed(p.i, 2)) p.b3T = 0;
        if (p.b3T >= 0) {
          if (inp.h[2]) {
            p.b3T += dt;
            if (p.b3T >= .38) {
              p.b3T = -1;
              if (p.flasks > 0) { p.flasks--; p.state = 'heal'; p.st = 0; p.healDone = false; }
              else { Snd.fail(); msg(p, 'Ramuan habis', 1.2); }
            }
          } else { p.b3T = -1; p.state = 'swap'; p.st = 0; Snd.swap(); }
        }
      } else p.b3T = -1;
      break;
    }
    case 'atk_w': {
      const a = COMBO[p.combo];
      if (p.st >= a.wind) { p.state = 'atk_a'; p.st = 0; a.heavy ? Snd.swingHeavy() : Snd.swing(); }
      break;
    }
    case 'atk_a': {
      const a = COMBO[p.combo];
      movePlayer(p, Math.cos(p.face) * a.lunge * dt, Math.sin(p.face) * a.lunge * dt);
      for (const e of targetables()) {
        if (p.hitSet.has(e) || e.air) continue;
        if (dist(p, e) - e.r <= a.range && Math.abs(angDiff(p.face, angTo(p, e))) <= a.arc / 2) {
          p.hitSet.add(e); hurtEnemy(e, a.dmg, p, { melee: true, poise: a.heavy ? 1.6 : 1 });
        }
      }
      if (p.st >= a.act) { p.state = 'atk_r'; p.st = 0; }
      break;
    }
    case 'atk_r': {
      const a = COMBO[p.combo];
      const open = p.combo < 2 && !p.chainLock && p.st >= a.rec - CHAIN_WIN;
      if (pressed(p.i, 0)) {
        if (open) { startAttack(p, p.combo + 1); break; }
        else if (p.combo < 2) p.chainLock = true; // terlalu cepat → kombo putus
      }
      if (p.st >= a.rec) { p.state = 'free'; p.st = 0; }
      break;
    }
    case 'block': {
      p.blockT += dt;
      walk(SPD * .42, 5);
      if (pressed(p.i, 0)) { startAttack(p, 0); break; }
      if (!inp.h[1]) { p.state = 'free'; p.st = 0; }
      break;
    }
    case 'draw': {
      p.drawT += dt;
      if (m > 0) { p.face = turnTo(p.face, mAng, 7 * dt); movePlayer(p, Math.cos(mAng) * SPD * .42 * m * dt, Math.sin(mAng) * SPD * .42 * m * dt); p.walk += SPD * .42 * m * dt * .11; p.moving = m * .5; }
      if (!inp.h[0]) p.relPending = true;
      if (pressed(p.i, 1)) { startRoll(p, inp.mx, inp.my, m); break; }
      if (p.relPending && p.drawT >= .28) fireArrow(p);
      break;
    }
    case 'shoot_r': if (p.st >= .34) { p.state = 'free'; p.st = 0; } break;
    case 'roll': {
      const D = .48, k = p.st / D;
      const sp = 300 * Math.pow(Math.max(0, 1 - k), .6) + 30;
      movePlayer(p, Math.cos(p.rollA) * sp * dt, Math.sin(p.rollA) * sp * dt);
      if (p.st > .03 && p.st < .30) p.iframe = Math.max(p.iframe, .02);
      if (Math.random() < .5) puff(p.x, p.y, 'rgba(150,140,130,', 1);
      if (p.st >= D) { p.state = 'roll_r'; p.st = 0; }
      break;
    }
    case 'roll_r': if (p.st >= .14) { p.state = 'free'; p.st = 0; } break;
    case 'heal': {
      walk(SPD * .3, 4);
      if (!p.healDone && p.st >= .65) {
        p.healDone = true; p.hp = Math.min(p.maxHp, p.hp + HEAL_AMT); Snd.heal();
        for (let k = 0; k < 18; k++) part(p.x + rand(-10, 10), p.y + rand(-10, 10), rand(-20, 20), rand(-60, -10), rand(.5, 1), '#ffd27a', 2.5, true);
      }
      if (p.st >= 1.0) { p.state = 'free'; p.st = 0; }
      break;
    }
    case 'swap': {
      if (p.st >= .2 && !p.swapped) { p.swapped = true; p.weapon = p.weapon === 'sword' ? 'bow' : 'sword'; p.swapHint = 4; }
      if (p.st >= .42) { p.state = 'free'; p.st = 0; p.swapped = false; }
      break;
    }
    case 'stag': if (p.st >= p.stagDur) { p.state = 'free'; p.st = 0; } break;
  }
}

function hurtPlayer(p, dmg, src, o = {}) {
  if (!p.alive || p.iframe > 0) return 'miss';
  const a = Math.atan2(src.y - p.y, src.x - p.x);
  const front = Math.abs(angDiff(p.face, a)) < 1.3;
  if (p.state === 'block' && front && !o.unblockable) {
    if (p.blockT < PARRY_WIN && o.parryable) {
      Snd.parry(); hitStop(.13); shake(6); vib(30); p.parryFx = .4;
      sparks(p.x + Math.cos(a) * 14, p.y + Math.sin(a) * 14, 22, '#fff6c8');
      p.stam = Math.min(p.maxStam, p.stam + 10);
      return 'parry';
    }
    Snd.block(); p.stam -= dmg * (o.guard || 1.3); p.stamCd = .8; p.hp -= dmg * .08;
    p.kx = -Math.cos(a) * 170; p.ky = -Math.sin(a) * 170;
    sparks(p.x + Math.cos(a) * 14, p.y + Math.sin(a) * 14, 8, '#ffd9a0');
    hitStop(.04); shake(2);
    if (p.stam <= 0) { p.stam = 0; p.state = 'stag'; p.st = 0; p.stagDur = 1.0; Snd.guardBreak(); msg(p, 'Tameng jebol!', 1.2); shake(6); }
    if (p.hp <= 0) downPlayer(p);
    return 'block';
  }
  p.hp -= dmg; p.flash = .2; p.iframe = .4;
  const kn = o.knock || 150; p.kx = -Math.cos(a) * kn; p.ky = -Math.sin(a) * kn;
  p.state = 'stag'; p.st = 0; p.stagDur = o.stagger || .34; p.b3T = -1; p.swapped = false;
  Snd.hurt(); hitStop(.07); shake(5); vib(45);
  blood(p.x, p.y, a + Math.PI, 10, '#8a1010');
  if (p.hp <= 0) downPlayer(p);
  return 'hit';
}
function downPlayer(p) {
  p.hp = 0; Snd.die();
  const q = players[1 - p.i];
  if (q.alive) { p.state = 'down'; p.down = true; p.downT = 25; p.revT = 0; msg(q, 'Rekanmu tumbang! Dekati untuk membangkitkan', 3); }
  else { p.state = 'down'; p.down = true; p.downT = 0; gameOver(); }
}
function revivePlayer(p, hpFrac) {
  p.down = false; p.dead = false; p.state = 'free'; p.st = 0; p.hp = Math.round(p.maxHp * hpFrac); p.hpLag = p.hp; p.iframe = 1.5; p.revT = 0;
  for (let k = 0; k < 20; k++) part(p.x, p.y, rand(-60, 60), rand(-60, 60), rand(.4, .9), '#fff1c0', 2, true);
  Snd.heal();
}
function gameOver() {
  if (G.mode === 'over') return;
  G.mode = 'over'; G.overT = 0; Snd.over(); Snd.music(false);
}

const ETYPE = {
  grunt: { hp: 55, r: 12, speed: 66, poise: 26, aggro: 230, col: '#a9ab9c', sc: 1.15, lw: 2.4 },
  archer: { hp: 38, r: 11, speed: 62, poise: 14, aggro: 320, col: '#b58ad6', sc: 1.1, lw: 2.2 },
  brute: { hp: 150, r: 19, speed: 46, poise: 75, aggro: 230, col: '#d06a4e', sc: 1.75, lw: 3.4 },
  warden: { hp: 680, r: 26, speed: 72, poise: 160, aggro: 999, col: '#c9b48a', sc: 2.5, lw: 4.2, boss: true },
  queen: { hp: 820, r: 20, speed: 64, poise: 130, aggro: 999, col: '#ff9a5c', sc: 2.0, lw: 3.4, boss: true },

function makeEnemy(type, x, y) {
  const d = ETYPE[type];
  return {

// ---------- proyektil & hazard ----------

}

function updateFlow(dt) {

    p.downT -= dt;
    if (q.alive && dist(p, q) < 46) { p.revT += dt; if (Math.random() < .3) part(p.x + rand(-8, 8), p.y + rand(-8, 8), 0, -30, .6, '#fff1c0', 2, true); }

      msg(q, 'Rekanmu gugur. Capai api unggun atau kalahkan bos untuk membangkitkannya', 4);
    }
  }
  if (G.mode === 'play' && !players.some(p => p.alive)) gameOver();

    for (const p of players) {

      if (!b.lit) {
        b.lit = true; L.checkpoint = b; Snd.bonfire(); banner('API UNGGUN MENYALA', 'Titik bangkit tersimpan', 3, '#ffb35c');

  const living = players.filter(p => !p.dead);

  } else if (L.gateState === 'open' && L.bossState === 'dormant') {

        L.gateState = 'sealed'; L.bossState = 'active'; L.boss.state = 'chase'; L.boss.cd = 1.4;
        banner(BOSS_NAMES[L.boss.type], '', 3.5, '#e8d9b0'); Snd.roar(); Snd.music(true); shake(8);
        L.boss.face = angTo(L.boss, players.find(p => p.alive));
      }
    }
  }

    } else if (liv.some(p => dist(p, L.portal) < 52)) for (const p of liv) if (dist(p, L.portal) < 52 && !p.msg) msg(p, 'Kedua pemain harus masuk portal', 1.2);
  }
}
function fadeTo(cb) { G.fadeDir = 1; G.fadeCb = cb; }
function levelIntro() { banner('LEVEL ' + (L.idx + 1), L.def.name, 3.2, '#e8d9b0'); }

function separate() {

  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {

// =====================================================================
//  UPDATE
// =====================================================================
function update(dt) {
  L.fieldT -= dt; if (L.fieldT <= 0) { computeFields(); L.fieldT = .3; }
  for (const p of players) updatePlayer(p, dt);
  for (const e of L.enemies) updateEnemy(e, dt);

  separate();
  updateProj(dt);
  updateParticles(dt);
  updateFlow(dt);
  if (L.bossState === 'active') { G.beatT -= dt; if (G.beatT <= 0) { G.beatT = .5; Snd.beat(G.beatN++); } }

function updateCam(dt) {
  const ps = players.filter(p => !p.dead); const list = ps.length ? ps : players;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p of list) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }

// ---------- stickman top-down ----------
function line(x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }

  o.top && o.top();
  ctx.restore();
}

function drawPlayer(p) {

    ctx.save(); ctx.globalAlpha = .35 + Math.sin(G.t * 3) * .1; ctx.fillStyle = p.col;

    ctx.fillStyle = '#141018'; ctx.beginPath(); ctx.arc(-14, 0, 5, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();

    ctx.strokeStyle = '#fff1c0'; ctx.beginPath(); ctx.arc(p.x, p.y, 24, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
    ctx.strokeStyle = `rgba(255,80,60,.8)`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 29, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(p.downT / 25, 0, 1)); ctx.stroke();

      }

        line(hx, hy, hx + Math.cos(ang) * len, hy + Math.sin(ang) * len);
        ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2.6;
        line(hx - Math.sin(ang) * 3.5, hy + Math.cos(ang) * 3.5, hx + Math.sin(ang) * 3.5, hy - Math.cos(ang) * 3.5);
        if (chainOpen) { ctx.fillStyle = '#fff'; ctx.globalAlpha = .9; const tx = hx + Math.cos(ang) * len, ty = hy + Math.sin(ang) * len; ctx.beginPath(); ctx.arc(tx, ty, 3 + Math.sin(G.t * 40) * 1, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }

      } else {
        ctx.beginPath(); ctx.moveTo(bx - 3, by - 8); ctx.quadraticCurveTo(bx + 4, by, bx - 3, by + 8); ctx.stroke();
        ctx.strokeStyle = 'rgba(230,230,220,.6)'; ctx.lineWidth = 1; line(bx - 3, by - 8, bx - 3, by + 8);
      }

    };

}

function drawEnemy(e) {
  const fade = e.dead ? clamp(1 - e.deadT / 1.5, 0, 1) : 1;

  if (e.dead) { // tergeletak
    ctx.translate(e.x, e.y); ctx.rotate(e.face); ctx.scale(e.sc, e.sc); ctx.strokeStyle = '#3a3036'; ctx.lineWidth = e.lw; ctx.lineCap = 'round';
    line(-10, 0, 8, 0); line(-4, 0, 2, -9); line(-4, 0, -9, 8); line(8, 0, 13, 5); line(8, 0, 14, -4);

  }

  if (e.boss && L.bossState === 'dormant') col = '#6a645c';
  const wa = weaponAngle(e);
  const hand = [Math.cos(wa) * 11, Math.sin(wa) * 11];
  const o = { x: e.x, y: e.y, z: e.z, face: e.face, col, lw: e.lw, sc: e.sc * (1 + e.z / 260), walk: e.walk, stride: e.state === 'chase' ? 4.5 : 0, headFill: '#0d0b10', armL: [7, -8], armR: hand };
  const st = e.state;

  if (e.type === 'grunt') {
    o.extra = () => { const [hx, hy] = o.armR, a = st === 'stag' || st === 'parried' ? 2.6 : wa; ctx.strokeStyle = '#7d7466'; ctx.lineWidth = 2.6; line(hx, hy, hx + Math.cos(a) * 17, hy + Math.sin(a) * 17); };

      ctx.strokeStyle = 'rgba(220,200,240,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(10, -9); ctx.lineTo(o.armR[0], 1); ctx.lineTo(10, 9); ctx.stroke();

  } else if (e.type === 'brute') {

      ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = 3.2; const ex = hx + Math.cos(a) * 20, ey = hy + Math.sin(a) * 20; line(hx, hy, ex, ey);

  } else if (e.type === 'warden') {

    o.extra = () => {
      const [hx, hy] = o.armR, a = st === 'stag' || st === 'parried' ? 2.6 : wa;
      ctx.strokeStyle = '#b8b0a0'; ctx.lineWidth = 3.4; line(hx, hy, hx + Math.cos(a) * 30, hy + Math.sin(a) * 30);
      ctx.strokeStyle = '#6a5030'; ctx.lineWidth = 3; line(hx - Math.sin(a) * 5, hy + Math.cos(a) * 5, hx + Math.sin(a) * 5, hy - Math.cos(a) * 5);

    o.extra = () => {
      const [hx, hy] = o.armR; ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = 2.4; line(hx - 8, hy, hx + 10, hy);

    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8, 0, TAU); ctx.stroke();
    for (let k = 0; k < 3; k++) { const a = G.t * 4 + k * TAU / 3; ctx.fillStyle = '#ffd36a'; ctx.beginPath(); ctx.arc(e.x + Math.cos(a) * (e.r + 8), e.y + Math.sin(a) * (e.r + 8), 2.2, 0, TAU); ctx.fill(); }

}

// ---------- latar: api unggun, gerbang, portal ----------
function drawBonfire(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = 'rgba(40,36,32,.9)'; ctx.beginPath(); ctx.ellipse(0, 0, 14, 12, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#3a3028'; ctx.lineWidth = 2; for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; line(Math.cos(a) * 4, Math.sin(a) * 4, Math.cos(a) * 12, Math.sin(a) * 12); }
  // pedang tertancap
  ctx.strokeStyle = '#8a8478'; ctx.lineWidth = 2.5; line(0, 0, 0, -16); ctx.lineWidth = 2; line(-5, -12, 5, -12);
  if (b.lit) {
    for (let k = 0; k < 3; k++) {
      const f = Math.sin(G.t * 9 + k * 2) * 2;
      ctx.fillStyle = ['rgba(255,90,30,.8)', 'rgba(255,170,60,.8)', 'rgba(255,240,170,.9)'][k];
      ctx.beginPath(); ctx.ellipse(0, -2 - k * 2, 8 - k * 2.5 + f * .3, 10 - k * 2.5 + f, 0, 0, TAU); ctx.fill();
    }
    if (Math.random() < .3) part(b.x + rand(-6, 6), b.y - 6, rand(-10, 10), rand(-60, -30), rand(.6, 1.2), '#ffb35c', 2, true);
  } else { ctx.fillStyle = 'rgba(255,120,60,' + (.15 + Math.sin(G.t * 2) * .1) + ')'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function drawGates() {
  if (L.gateState === 'open') return;
  const sealed = L.gateState === 'sealed', c = sealed ? '255,90,60' : L.def.fog;
  for (const g of L.gates) {
    for (let k = 0; k < 6; k++) {
      const a = G.t * .8 + k * 1.3 + g.x * .01;
      ctx.fillStyle = `rgba(${c},${sealed ? .1 : .12})`;
      ctx.beginPath(); ctx.arc(g.x + Math.cos(a) * 12, g.y + Math.sin(a * 1.3) * 12, 16 + Math.sin(a * 2) * 4, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = `rgba(${c},.14)`; ctx.fillRect(g.x - T / 2, g.y - T / 2, T, T);
  }
}
function drawPortal(pt) {
  const k = Math.min(1, pt.t / 1.2);
  ctx.save(); ctx.translate(pt.x, pt.y);
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = `rgba(255,${220 - i * 20},${150 + i * 25},${(.7 - i * .12) * k})`; ctx.lineWidth = 3 - i * .5;
    ctx.beginPath(); ctx.arc(0, 0, Math.max(1, (22 + i * 9) * k + Math.sin(G.t * 3 + i) * 2),G.t * (1 + i * .4), G.t * (1 + i * .4) + Math.PI * 1.4); ctx.stroke();
  }
  ctx.fillStyle = `rgba(255,240,200,${.25 * k})`; ctx.beginPath(); ctx.arc(0, 0, 20 * k, 0, TAU); ctx.fill();
  ctx.restore();
  if (Math.random() < .4) part(pt.x + rand(-30, 30), pt.y + rand(-30, 30), 0, -30, 1, '#fff1c0', 2, true);
}

// =====================================================================
//  RENDER UTAMA
// =====================================================================
function worldT(sx = 0, sy = 0) {
  baseT(); ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
}
function render() {
  baseT(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (G.mode === 'title') { drawTitle(); drawFade(); return; }
  if (G.mode === 'win') { drawWin(); drawFade(); return; }
  const shx = (Math.random() - .5) * G.shake * 2, shy = (Math.random() - .5) * G.shake * 2;
  worldT(shx, shy);
  ctx.drawImage(L.cv, 0, 0);
  for (const d of L.decals) { ctx.fillStyle = d.col; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * .7, d.rot, 0, TAU); ctx.fill(); }
  drawGates();
  for (const b of L.bonfires) drawBonfire(b);
  if (L.portal) drawPortal(L.portal);
  // hazard di tanah
  for (const h of L.hazards) {
    if (h.kind === 'pillar') {
      if (!h.done) teleCircle(h.x, h.y, h.r, clamp(h.t / h.delay, 0, 1));
      else { const k = (h.t - h.delay) / .45; ctx.fillStyle = `rgba(255,140,50,${.6 * (1 - k)})`; ctx.beginPath(); ctx.arc(h.x, h.y, h.r * (1 + k * .2), 0, TAU); ctx.fill(); }
    }
  }
  const ents = [...L.enemies, ...players].sort((a, b) => (a.dead ? -1 : 0) - (b.dead ? -1 : 0) || a.y - b.y);
  for (const e of ents) e instanceof Player ? drawPlayer(e) : drawEnemy(e);
  // proyektil
  for (const pr of L.projectiles) {
    if (pr.kind === 'arrow') {
      const a = Math.atan2(pr.vy, pr.vx); ctx.strokeStyle = pr.owner === 'p' ? (pr.full ? '#fff3b0' : '#e8e0d0') : '#d8a0ff'; ctx.lineWidth = 2;
      line(pr.x - Math.cos(a) * 12, pr.y - Math.sin(a) * 12, pr.x + Math.cos(a) * 3, pr.y + Math.sin(a) * 3);
    } else {
      ctx.fillStyle = pr.owner === 'p' ? '#bff' : '#ffb04a'; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r * .45, 0, TAU); ctx.fill();
    }
  }
  // partikel
  for (const p of L.particles) {
    const k = p.life / p.max;
    ctx.globalAlpha = Math.min(1, k * 1.5); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.glow ? k : 1), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // gelombang kejut
  for (const f of G.fx) { const k = f.t / .4; ctx.strokeStyle = `rgba(255,230,190,${.6 * (1 - k)})`; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (.6 + k * .6), 0, TAU); ctx.stroke(); }
  for (const h of L.hazards) if (h.kind === 'ring') { ctx.strokeStyle = 'rgba(255,200,140,.8)'; ctx.lineWidth = h.w * .6; ctx.beginPath(); ctx.arc(h.x, h.y, h.rad, 0, TAU); ctx.stroke(); }

  drawLighting();

  // lapisan pasca-cahaya: telegraf & bar HP (supaya selalu terbaca)
  worldT(shx, shy);
  for (const e of L.enemies) {
    if (e.dead) continue;
    if (e.state === 'atk' && e.atk.def.tele) {
      const a = e.atk;
      if (a.ph === 'w') a.def.tele(e, a, clamp(a.t / (a.def.wind / e.spdMul), 0, 1));
      else if (a.ph === 'a' && a.def.teleAct) a.def.teleAct(e, a);
    }
    if (!e.boss && e.showHp > 0 && e.hp < e.maxHp) {
      const w = 30, x = e.x - w / 2, y = e.y - e.r * 1.4 - 12;
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 1, y - 1, w + 2, 5);
      ctx.fillStyle = '#e8d0a0'; ctx.fillRect(x, y, w * e.hpLag / e.maxHp, 3);
      ctx.fillStyle = '#b3261e'; ctx.fillRect(x, y, w * e.hp / e.maxHp, 3);
    }
  }
  for (const pr of L.projectiles) if (pr.kind === 'orb') { ctx.fillStyle = pr.owner === 'p' ? 'rgba(160,255,255,.35)' : 'rgba(255,150,60,.35)'; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r * 2, 0, TAU); ctx.fill(); }
  // penanda pemain di atas gelap
  for (const p of players) if (p.alive) { ctx.fillStyle = `rgba(${p.glow},.9)`; ctx.beginPath(); const a = p.face; ctx.moveTo(p.x + Math.cos(a) * 24, p.y + Math.sin(a) * 24); ctx.lineTo(p.x + Math.cos(a + .25) * 19, p.y + Math.sin(a + .25) * 19); ctx.lineTo(p.x + Math.cos(a - .25) * 19, p.y + Math.sin(a - .25) * 19); ctx.fill(); }

  baseT();
  drawVignette();
  drawControls();
  for (let i = 0; i < 2; i++) inFrame(i, (LW, LH) => drawHUD(players[i], LW, LH));
  drawPauseBtn();
  if (G.mode === 'over') drawOver();
  if (G.mode === 'pause') drawPause();
  drawFade();
}
function drawLighting() {
  const lw = lightCv.width, lh = lightCv.height, s = .5;
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, lw, lh);
  lctx.fillStyle = `rgba(4,2,8,${L.def.dark})`; lctx.fillRect(0, 0, lw, lh);
  lctx.globalCompositeOperation = 'destination-out';
  const toS = (x, y) => [((x - cam.x) * cam.z + W / 2) * s, ((y - cam.y) * cam.z + H / 2) * s];
  const light = (x, y, r, a = 1) => {
    const [sx, sy] = toS(x, y), rr = r * cam.z * s;
    if (sx < -rr || sy < -rr || sx > lw + rr || sy > lh + rr) return;
    const g = lctx.createRadialGradient(sx, sy, 0, sx, sy, rr);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(.55, `rgba(0,0,0,${a * .7})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.beginPath(); lctx.arc(sx, sy, rr, 0, TAU); lctx.fill();
  };
  for (const p of players) if (!p.dead) light(p.x, p.y, p.alive ? 230 : 120);
  for (const b of L.bonfires) light(b.x, b.y, b.lit ? 260 + Math.sin(G.t * 7) * 8 : 70, b.lit ? 1 : .5);
  for (const pr of L.projectiles) if (pr.kind === 'orb') light(pr.x, pr.y, 70, .8);
  for (const h of L.hazards) if (h.kind === 'pillar') light(h.x, h.y, h.done ? 140 : 60, h.done ? 1 : .4);
  if (L.portal) light(L.portal.x, L.portal.y, 200);
  if (L.bossState === 'active') { light(L.bossSpawn.x, L.bossSpawn.y, 520, .55); if (L.boss && !L.boss.dead) light(L.boss.x, L.boss.y, 160, .6); }
  if (L.gateState !== 'open') for (const g of L.gates) light(g.x, g.y, 70, .5);
  baseT(); ctx.drawImage(lightCv, 0, 0, W, H);
  // cahaya hangat aditif
  ctx.globalCompositeOperation = 'lighter';
  worldT();
  const warm = (x, y, r, c) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
  for (const b of L.bonfires) if (b.lit) warm(b.x, b.y, 120, 'rgba(255,120,40,.22)');
  for (const h of L.hazards) if (h.kind === 'pillar' && h.done) warm(h.x, h.y, 80, 'rgba(255,120,40,.35)');
  ctx.globalCompositeOperation = 'source-over';
}
let vigCache = null, vigKey = '';
function drawVignette() {
  const key = W + 'x' + H;
  if (vigKey !== key) {
    vigKey = key; vigCache = document.createElement('canvas'); vigCache.width = W; vigCache.height = H;
    const g = vigCache.getContext('2d'), gr = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .62);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  ctx.drawImage(vigCache, 0, 0);
}

// ---------- kontrol ----------
function drawIcon(kind, x, y, s, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'sword') { line(-8, 8, 8, -8); line(-6, 2, -2, 6); line(-9, 9, -6, 6); }
  else if (kind === 'shield') { ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(8, -6); ctx.quadraticCurveTo(8, 6, 0, 10); ctx.quadraticCurveTo(-8, 6, -8, -6); ctx.closePath(); ctx.stroke(); line(0, -6, 0, 6); }
  else if (kind === 'bow') { ctx.beginPath(); ctx.moveTo(-4, -10); ctx.quadraticCurveTo(8, 0, -4, 10); ctx.stroke(); ctx.lineWidth = 1; line(-4, -10, -4, 10); ctx.lineWidth = 2; line(-8, 0, 10, 0); line(10, 0, 6, -3); line(10, 0, 6, 3); }
  else if (kind === 'roll') { ctx.beginPath(); ctx.arc(0, 2, 7, Math.PI * .9, Math.PI * 2.3); ctx.stroke(); line(6, 6, 8, 1); line(6, 6, 1, 6); ctx.beginPath(); ctx.arc(-1, -7, 2.5, 0, TAU); ctx.fill(); }
  else if (kind === 'swap') { ctx.beginPath(); ctx.arc(0, 0, 7, -.3, Math.PI * .8); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 7, Math.PI * .7, Math.PI * 1.8); ctx.stroke(); line(6.5, -2.5, 8, 2); }
  ctx.restore();
}
function drawControls() {
  if (G.mode !== 'play' && G.mode !== 'over') return;
  for (let i = 0; i < 2; i++) {
    const c = ctrls[i], p = players[i], n = IN[i], rot = i === 0 ? Math.PI / 2 : -Math.PI / 2;
    // joystick
    const j = n.joy, bx = j ? j.bx : c.joy.x, by = j ? j.by : c.joy.y;
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.strokeStyle = `rgba(${p.glow},.35)`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, c.joy.r, 0, TAU); ctx.fill(); ctx.stroke();
    const kx = bx + (j ? j.dx : 0) * c.joy.r * .7, ky = by + (j ? j.dy : 0) * c.joy.r * .7;
    ctx.fillStyle = `rgba(${p.glow},${j ? .55 : .25})`; ctx.beginPath(); ctx.arc(kx, ky, c.joy.r * .42, 0, TAU); ctx.fill();
    // tombol
    const sword = p.weapon === 'sword';
    const busy = !p.alive;
    const chainOpen = p.state === 'atk_r' && p.combo < 2 && !p.chainLock && p.st >= COMBO[p.combo].rec - CHAIN_WIN;
    const icons = [sword ? 'sword' : 'bow', sword ? 'shield' : 'roll', 'swap'];
    for (let k = 0; k < 3; k++) {
      const b = c.b[k], held = n.h[k];
      ctx.fillStyle = held ? `rgba(${p.glow},.45)` : 'rgba(255,255,255,.07)';
      ctx.strokeStyle = (k === 0 && chainOpen) ? '#ffffff' : `rgba(${p.glow},${busy ? .15 : .5})`; ctx.lineWidth = (k === 0 && chainOpen) ? 4 : 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
      drawIcon(icons[k], b.x, b.y, b.r / 15, rot, busy ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.85)');
    }
    // tahan tombol 3 → progres minum ramuan
    if (p.b3T > 0) { const b = c.b[2]; ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(p.b3T / .38, 0, 1)); ctx.stroke(); }
    // stamina ring di tombol 1/2 kalau habis
    if (p.stam <= 1 && p.alive) for (const k of [0, 1]) { const b = c.b[k]; ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); }
  }
}
function drawPauseBtn() {
  if (G.mode !== 'play') return;
  const x = W / 2, y = 20 * U, r = 15 * U;
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x - 5 * U, y - 6 * U, 3.5 * U, 12 * U); ctx.fillRect(x + 1.5 * U, y - 6 * U, 3.5 * U, 12 * U);
}

// ---------- HUD (dalam bingkai baca pemain) ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, size, col, align = 'center', font = 'sans-serif', weight = '600') {
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillText(s, x + 1, y + 1.5); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const SERIF = 'Georgia, "Times New Roman", serif';
function drawHUD(p, LW, LH) {
  const u = U, base = LH - 226 * u, bw = Math.min(230 * u, LW * .62), x = LW / 2 - bw / 2;
  // HP
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 2, base - 2, bw + 4, 12 * u);
  ctx.fillStyle = '#e8d0a0'; ctx.fillRect(x, base, bw * clamp(p.hpLag / p.maxHp, 0, 1), 8 * u);
  ctx.fillStyle = p.hp / p.maxHp < .3 ? '#e0372c' : '#b3261e'; ctx.fillRect(x, base, bw * clamp(p.hp / p.maxHp, 0, 1), 8 * u);
  // stamina
  const sw = bw * .8;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 2, base + 12 * u, sw + 4, 8 * u);
  ctx.fillStyle = p.stamCd > 0 && p.stam < 25 ? '#6a8a3a' : '#5fae4a'; ctx.fillRect(x, base + 14 * u, sw * clamp(p.stam / p.maxStam, 0, 1), 4 * u);
  // label & ramuan
  txt(p.i === 0 ? 'P1' : 'P2', x - 16 * u, base + 7 * u, 12 * u, p.col);
  for (let k = 0; k < MAX_FLASK; k++) {
    const fx2 = x + sw + 16 * u + k * 13 * u, fy2 = base + 16 * u;
    ctx.fillStyle = k < p.flasks ? '#ffb347' : 'rgba(255,255,255,.15)';
    ctx.beginPath(); ctx.arc(fx2, fy2, 4.2 * u, 0, TAU); ctx.fill(); ctx.fillRect(fx2 - 1.5 * u, fy2 - 8 * u, 3 * u, 4 * u);
  }
  txt(p.weapon === 'sword' ? 'Pedang & Tameng' : 'Busur', x, base - 10 * u, 10 * u, 'rgba(230,220,200,.75)', 'left');
  // bar bos
  if (L.bossState === 'active' && L.boss && !L.boss.dead) {
    const b = L.boss, by = base - 46 * u, bbw = Math.min(300 * u, LW * .82), bx = LW / 2 - bbw / 2;
    txt(BOSS_NAMES[b.type], bx, by - 9 * u, 12 * u, '#e8d9b0', 'left', SERIF, '400');
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(bx - 2, by - 2, bbw + 4, 9 * u);
    ctx.fillStyle = '#e8d0a0'; ctx.fillRect(bx, by, bbw * b.hpLag / b.maxHp, 5 * u);
    ctx.fillStyle = '#9a1c16'; ctx.fillRect(bx, by, bbw * b.hp / b.maxHp, 5 * u);
  }
  // pesan & tutorial
  let my = base - (L.bossState === 'active' ? 80 : 34) * u;
  if (p.msg) { const a = clamp(Math.min(p.msg.t * 6, (p.msg.dur - p.msg.t) * 3), 0, 1); ctx.globalAlpha = a; txt(p.msg.text, LW / 2, my, 13 * u, '#fff1d0'); ctx.globalAlpha = 1; my -= 20 * u; }
  if (p.state === 'down') { txt('TUMBANG — tunggu rekanmu (' + Math.ceil(p.downT) + ')', LW / 2, my, 13 * u, '#ff8a70'); my -= 20 * u; }
  if (p.dead) { txt('Gugur — rekanmu bisa membangkitkanmu di api unggun', LW / 2, my, 12 * u, '#c8b8a8'); my -= 20 * u; }
  const hintA = G.hintT > 0 ? clamp(G.hintT, 0, 1) : p.swapHint > 0 ? clamp(p.swapHint, 0, 1) : 0;
  if (hintA > 0 && p.alive) {
    ctx.globalAlpha = hintA * .9;
    const lines = p.weapon === 'sword'
      ? ['Tombol 1: tebas — tekan lagi saat pedang berkilau untuk kombo', 'Tahan 2: tameng — angkat tepat sebelum kena = TANGKIS']
      : ['Tahan & lepas 1: panah — tahan lebih lama = tembakan kuat', 'Tombol 2: guling ke depan (kebal sesaat)'];
    lines.push('Ketuk 3: ganti senjata • Tahan 3: minum ramuan');
    for (const s of lines) { txt(s, LW / 2, my, 11 * u, '#e8dcc0', 'center', 'sans-serif', '500'); my -= 16 * u; }
    ctx.globalAlpha = 1;
  }
  // banner
  for (const b of G.banners) {
    const a = clamp(Math.min(b.t * 2, (b.dur - b.t) * 1.5), 0, 1); if (a <= 0) continue;
    ctx.globalAlpha = a;
    const cy = LH * .56;
    if (b.text) {
      const g = ctx.createLinearGradient(0, 0, LW, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, cy - 26 * u, LW, 52 * u);
      txt(b.text, LW / 2, cy - (b.sub ? 6 : 0) * u, (b.text.length > 22 ? 19 : 24) * u, b.color, 'center', SERIF, '400');
      if (b.sub) txt(b.sub, LW / 2, cy + 15 * u, 12 * u, '#cfc3a8', 'center', SERIF, '400');
    } else if (b.sub) txt(b.sub, LW / 2, cy, 15 * u, b.color, 'center', SERIF, 'italic 400');
    ctx.globalAlpha = 1;
  }
}
function drawOver() {
  const k = clamp(G.overT / 1.2, 0, 1);
  baseT(); ctx.fillStyle = `rgba(0,0,0,${k * .55})`; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 2; i++) inFrame(i, (LW, LH) => {
    ctx.globalAlpha = k;
    const g = ctx.createLinearGradient(0, 0, LW, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,.8)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, LH * .7 - 34 * U, LW, 68 * U);
    txt('TUMBANG', LW / 2, LH * .7, 40 * U * (1 + (1 - k) * .1), '#a8201a', 'center', SERIF, '400');
    ctx.globalAlpha = 1;
  });
}
function drawFade() { if (G.fade > 0) { baseT(); ctx.fillStyle = `rgba(0,0,0,${G.fade})`; ctx.fillRect(0, 0, W, H); } }

// ---------- menu (judul, jeda, menang) ----------
let embers = [];
function emberBg(dt) {
  if (embers.length < 70) embers.push({ x: Math.random() * W, y: H + 10, vx: rand(-10, 10), vy: rand(-50, -15), life: rand(3, 8), t: 0, s: rand(1, 2.6) });
  ctx.fillStyle = '#07050a'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * .55); g.addColorStop(0, 'rgba(120,50,20,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const e of embers) {
    e.t += dt; e.x += (e.vx + Math.sin(e.t * 2 + e.s) * 12) * dt; e.y += e.vy * dt;
    ctx.globalAlpha = clamp(Math.min(e.t, e.life - e.t), 0, 1) * .8; ctx.fillStyle = '#ff9a4a'; ctx.beginPath(); ctx.arc(e.x, e.y, e.s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1; embers = embers.filter(e => e.t < e.life);
}
function menuButtons() {
  const u = U, LW = H, LH = W;
  if (G.mode === 'title') {
    const bw = 120 * u, bh = 44 * u, y = LH * .79;
    return [{ id: 'l1', x: LW / 2 - bw - 8 * u, y, w: bw, h: bh, label: 'LEVEL 1', done: SAVE.cleared.includes(0) }, { id: 'l2', x: LW / 2 + 8 * u, y, w: bw, h: bh, label: 'LEVEL 2', done: SAVE.cleared.includes(1) }];
  }
  if (G.mode === 'pause') {
    const bw = 120 * u, bh = 44 * u, y = LH * .77;
    return [{ id: 'resume', x: LW / 2 - bw - 8 * u, y, w: bw, h: bh, label: 'LANJUT' }, { id: 'quit', x: LW / 2 + 8 * u, y, w: bw, h: bh, label: 'KE JUDUL' }];
  }
  if (G.mode === 'win' && G.winT > 2) return [{ id: 'title', x: LW / 2 - 70 * u, y: LH * .82, w: 140 * u, h: 44 * u, label: 'KE JUDUL' }];
  return [];
}
function drawMenuButtons() {
  for (let i = 0; i < 2; i++) inFrame(i, () => {
    for (const b of menuButtons()) {
      rr(b.x, b.y, b.w, b.h, 6 * U); ctx.fillStyle = 'rgba(30,20,16,.85)'; ctx.fill();
      ctx.strokeStyle = 'rgba(232,217,176,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
      txt(b.label, b.x + b.w / 2, b.y + b.h / 2, 15 * U, '#e8d9b0', 'center', SERIF, '400');
      if (b.done) txt('✓', b.x + b.w - 12 * U, b.y + 12 * U, 11 * U, '#ffb347');
    }
  });
}
function uiTap(q) {
  for (let i = 0; i < 2; i++) {
    const f = screenToFrame(i, q);
    for (const b of menuButtons()) {
      if (f.x >= b.x && f.x <= b.x + b.w && f.y >= b.y && f.y <= b.y + b.h) {
        Snd.swap();
        if (b.id === 'l1') startGame(0);
        else if (b.id === 'l2') startGame(1);
        else if (b.id === 'resume') G.mode = 'play';
        else if (b.id === 'quit' || b.id === 'title') { G.mode = 'title'; Snd.music(false); }
        return;
      }
    }
  }
}
function togglePause() {
  if (G.mode === 'play') { G.mode = 'pause'; for (const n of IN) { n.tb = [0, 0, 0]; n.joy = null; } ptrs.clear(); }
  else if (G.mode === 'pause') G.mode = 'play';
}
function drawTitle() {
  emberBg(1 / 60);
  // garis pembatas tengah
  ctx.strokeStyle = 'rgba(255,154,74,.15)'; ctx.lineWidth = 1; line(W / 2, H * .1, W / 2, H * .9);
  for (let i = 0; i < 2; i++) inFrame(i, (LW, LH) => {
    txt('BARA KEMBAR', LW / 2, LH * .6, 34 * U, '#e8d9b0', 'center', SERIF, '400');
    txt('dua jiwa, satu nyala', LW / 2, LH * .6 + 28 * U, 13 * U, '#b8a888', 'center', SERIF, 'italic 400');
    txt('Letakkan HP mendatar • P1 & P2 duduk berhadapan', LW / 2, LH * .94, 10.5 * U, 'rgba(220,210,190,.6)', 'center', 'sans-serif', '500');
  });
  drawMenuButtons();
}
function drawPause() {
  baseT(); ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 2; i++) inFrame(i, (LW, LH) => {
    txt('JEDA', LW / 2, LH * .66, 30 * U, '#e8d9b0', 'center', SERIF, '400');
  });
  drawMenuButtons();
}
function drawWin() {
  G.winT += 1 / 60;
  emberBg(1 / 60);
  for (let i = 0; i < 2; i++) inFrame(i, (LW, LH) => {
    const a = clamp(G.winT / 1.5, 0, 1); ctx.globalAlpha = a;
    txt('NYALA BERTAHAN', LW / 2, LH * .62, 30 * U, '#ffd27a', 'center', SERIF, '400');
    txt('Kalian menaklukkan semua level. Terima kasih telah bermain!', LW / 2, LH * .62 + 30 * U, 12 * U, '#cfc3a8', 'center', SERIF, 'italic 400');
    ctx.globalAlpha = 1;
  });
  drawMenuButtons();
}

function tryFullscreen() {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) {
      el.requestFullscreen({ navigationUI: 'hide' }).then(() => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => { }); } catch (e) { } }).catch(() => { });
    }
  } catch (e) { }
}
function startGame(idx) {
  Snd.init(); tryFullscreen();
  players[0].weapon = 'sword'; players[1].weapon = 'bow';
  for (const n of IN) { n.tb = [0, 0, 0]; n.joy = null; n.pv = [1, 1, 1]; }
  ptrs.clear();
  G.banners = []; G.fx = []; G.slowT = 0;
  loadLevel(idx); G.mode = 'play'; G.fade = 1; G.fadeDir = -1;
  levelIntro();
  G.hintT = idx === 0 ? 14 : 6;
}

// =====================================================================
//  LOOP
// =====================================================================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  try { step(now); } catch (err) { console.error(err); }
}
function step(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now; G.t += dt;
  pollInput();
  if (G.mode === 'play' || G.mode === 'over') {
    let ran = false;
    if (G.hitStop > 0) G.hitStop -= dt;
    else {
      if (G.slowT > 0) G.slowT -= dt;
      update(dt * (G.slowT > 0 ? .3 : 1)); ran = true;
    }
    updateCam(dt);
    G.shake = Math.max(0, G.shake - dt * 30);
    if (G.hintT > 0) G.hintT -= dt;
    for (const b of G.banners) b.t += dt;
    G.banners = G.banners.filter(b => b.t < b.dur);
    if (ran) endInput();
  } else endInput();
  // fade
  if (G.fadeDir === 1) { G.fade += dt * 1.8; if (G.fade >= 1) { G.fade = 1; G.fadeDir = -1; const cb = G.fadeCb; G.fadeCb = null; cb && cb(); } }
  else if (G.fadeDir === -1) { G.fade -= dt * 1.4; if (G.fade <= 0) { G.fade = 0; G.fadeDir = 0; } }
  render();
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') togglePause(); });
resize();
requestAnimationFrame(frame);
</script>
