<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Bara Kembar</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Urutan penting: file di bawah memakai variabel global dari file di atasnya. -->
<script src="js/util.js"></script>     <!-- util, canvas, orientasi -->
<script src="js/world.js"></script>    <!-- konstanta dunia, data level, simpanan -->
<script src="js/audio.js"></script>    <!-- suara sintetis (WebAudio) -->
<script src="js/input.js"></script>    <!-- sentuh, keyboard, tata letak tombol -->
<script src="js/state.js"></script>    <!-- state global -->
<script src="js/level.js"></script>    <!-- muat level, tabrakan, prerender peta -->
<script src="js/player.js"></script>   <!-- pemain -->
<script src="js/enemies.js"></script>  <!-- musuh, serangan, AI musuh -->
<script src="js/monsters.js"></script> <!-- monster khas level 3–7 -->
<script src="js/bot.js"></script>      <!-- bot rekan (mode solo) -->
<script src="js/effects.js"></script>  <!-- proyektil, hazard, partikel -->
<script src="js/flow.js"></script>     <!-- api unggun, kabut, bos, portal -->
<script src="js/render.js"></script>   <!-- render dunia, stickman, cahaya -->
<script src="js/ui.js"></script>       <!-- kontrol, HUD, menu -->
<script src="js/main.js"></script>     <!-- update, kamera, start, loop -->
</body>
</html>
