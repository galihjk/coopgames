<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Pengendali coopgames</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#e8ebf7;font-family:"Segoe UI",system-ui,sans-serif;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
  #gabung{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:#0b1020;overflow:auto}
  #gabung h1{margin:0;font-size:1.4rem}
  #gabung p{margin:0;color:#9aa3c7;max-width:340px;line-height:1.45;font-size:.9rem}
  #kode{font:700 2rem/1 ui-monospace,monospace;letter-spacing:.3em;text-align:center;text-transform:uppercase;width:8ch;padding:10px 0 10px .3em;
    border-radius:12px;border:1px solid #2a3358;background:#141a2e;color:#fff}
  #tombolGabung{font:700 1.1rem system-ui;padding:14px 34px;border-radius:14px;border:0;background:#6c8dff;color:#0b1020}
  #statusGabung{min-height:1.4em;color:#ffc46b;font-size:.9rem}
  @media (max-height:420px){ /* HP mendatar: ringkas supaya tidak terpotong */
    #gabung{gap:8px;justify-content:flex-start;padding-top:12px}
    #gabung h1{font-size:1.1rem} #gabung p{font-size:.8rem} #kode{font-size:1.5rem;padding:6px 0 6px .3em} #tombolGabung{padding:10px 30px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gabung">
  <h1>🎮 Pengendali coopgames</h1>
  <p>Masukkan kode yang tampil di layar komputer. HP dan komputer harus tersambung ke WiFi router yang sama (hotspot HP tidak bisa).</p>
  <input id="kode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Kode ruang">
  <button id="tombolGabung" type="button">Gabung</button>
  <div id="statusGabung" aria-live="polite"></div>
  <p>Pegang HP mendatar. Layar akan menjadi layar penuh.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="koneksi.js"></script>
<script>
'use strict';
// =====================================================================
//  PENGENDALI HP (generik) — menggambar kontrol sesuai SUSUNAN yang dikirim layar
//  (lihat kontrol.js untuk format susunan & pesan). Satu halaman ini melayani semua game
//  format "Layar + HP"; QR selalu menuju /pad/#KODE.
//
//  Zona (separuh kiri / separuh kanan layar HP), keduanya MENGAMBANG: titik jempol mendarat
//  menjadi pusat lingkaran, jadi jempol tidak perlu mengenai titik tertentu.
//    'stik' : joystick, mengirim arah + kekuatan terus-menerus.
//    'arah' : ketuk = aksi ke arah hadap; tahan + geser = bidik; lepas = aksi ke arah bidikan.
//  Tombol tap: tanpa arah, memicu saat DITEKAN; letakkan berjauhan (x,y relatif di susunan).
//  Alasan rancangan (uji HP 24-11-2026): saat mata menatap layar komputer, jempol tidak bisa
//  membidik tombol kecil yang posisinya tetap.
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const elGabung = document.getElementById('gabung'), elKode = document.getElementById('kode'), elStatus = document.getElementById('statusGabung');
const ATAS = 34;                 // tinggi bilah status
let W = 0, H = 0, DPR = 1, U = 1;
const idPaksa = new URLSearchParams(location.search).get('id') || ''; // hanya untuk uji otomatis

const st = {
  tata: null,                    // {v, susunan}
  zona: [],                      // per zona susunan: {id, ox, oy, x, y, ax, ay, c, lx, ly}
  tombol: [],                    // per tombol susunan: {id, c}
  q: 0, kotor: true, kirimTerakhir: 0,
  info: null, status: 'belum', diag: null, pesanStatus: '', aktif: false,
};
let net = null, wakeLock = null;

// ---------- tata letak ----------
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; U = Math.min(W, H);
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();
const mendatar = () => W > H;
const sus = () => st.tata && st.tata.susunan;
const RZ = () => .16 * U;        // jari-jari lingkaran zona
function posTombol(t) {
  const r = .12 * U, x0 = r + 10, x1 = W - r - 10, y0 = ATAS + r + 8, y1 = H - r - 8;
  return { x: x0 + t.x * (x1 - x0), y: y0 + t.y * (y1 - y0), r };
}
const pusatZona = z => z.sisi === 'kiri' ? { x: W * .24, y: H * .62 } : { x: W * .76, y: H * .64 };

function pasangTata(tata) {
  st.tata = tata;
  st.zona = tata.susunan.zona.map(z => ({ id: null, ox: 0, oy: 0, x: 0, y: 0, ax: 0, ay: 0, c: 0, lx: 0, ly: 0 }));
  st.tombol = tata.susunan.tombol.map(() => ({ id: null, c: 0 }));
  st.kotor = true;
}

// ---------- sentuhan ----------
function tombolDi(x, y) {
  let pilih = -1, terdekat = Infinity;
  sus().tombol.forEach((t, i) => { const p = posTombol(t), d = Math.hypot(x - p.x, y - p.y); if (d < p.r * 1.3 && d < terdekat) { terdekat = d; pilih = i; } });
  return pilih;
}
cv.addEventListener('pointerdown', e => {
  if (!st.aktif || !sus()) return;
  const x = e.clientX, y = e.clientY;
  if (y < ATAS) return; // bilah status (ada tombol ⛶), bukan area kontrol
  e.preventDefault();
  const i = tombolDi(x, y);
  if (i >= 0) {
    const b = st.tombol[i]; if (b.id !== null) return;
    b.id = e.pointerId; b.c++;   // tombol tap memicu saat ditekan
    getar(12);
  } else {
    const sisi = x < W / 2 ? 'kiri' : 'kanan', zi = sus().zona.findIndex(z => z.sisi === sisi);
    if (zi < 0) return;
    const z = st.zona[zi]; if (z.id !== null) return;
    Object.assign(z, { id: e.pointerId, ox: x, oy: y, x, y, ax: 0, ay: 0 });
    if (sus().zona[zi].jenis === 'arah') getar(10);
  }
  st.kotor = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* sebagian browser menolak; tidak wajib */ }
});
cv.addEventListener('pointermove', e => {
  if (!sus()) return;
  sus().zona.forEach((zs, i) => {
    const z = st.zona[i]; if (z.id !== e.pointerId) return;
    z.x = e.clientX; z.y = e.clientY; st.kotor = true;
    if (zs.jenis !== 'arah') return;
    const dx = z.x - z.ox, dy = z.y - z.oy, d = Math.hypot(dx, dy);
    if (d > .045 * U) { z.ax = dx / d; z.ay = dy / d; } else if (d < .02 * U) { z.ax = z.ay = 0; } // kembali ke tengah = batal bidik
  });
});
function lepas(e, batal) {
  if (!sus()) return;
  sus().zona.forEach((zs, i) => {
    const z = st.zona[i]; if (z.id !== e.pointerId) return;
    z.id = null;
    if (zs.jenis === 'arah' && !batal) { z.c++; z.lx = z.ax; z.ly = z.ay; } // pointercancel (gestur sistem) tidak memicu aksi
    z.ax = z.ay = 0; st.kotor = true;
  });
  for (const b of st.tombol) if (b.id === e.pointerId) { b.id = null; st.kotor = true; }
}
cv.addEventListener('pointerup', e => lepas(e, false));
cv.addEventListener('pointercancel', e => lepas(e, true));
cv.addEventListener('contextmenu', e => e.preventDefault());

function arahStik(z) {
  if (z.id === null) return [0, 0];
  const dx = z.x - z.ox, dy = z.y - z.oy, d = Math.hypot(dx, dy);
  if (d < 3) return [0, 0];
  const m = Math.min(1, d / RZ());
  return [dx / d * m, dy / d * m];
}
const r3 = v => Math.round(v * 1000) / 1000;
function kirimStatus(now) {
  if (!net || !net.tersambung || !sus()) return;
  if (!st.kotor && now - st.kirimTerakhir < 100) return; // minimal 10×/dtk sebagai tanda hidup
  const z = sus().zona.map((zs, i) => {
    const s = st.zona[i];
    if (zs.jenis === 'stik') return arahStik(s).map(r3);
    return [s.id !== null ? 1 : 0, r3(s.ax), r3(s.ay), s.c, r3(s.lx), r3(s.ly)];
  });
  const b = st.tombol.map(t => [t.id !== null ? 1 : 0, t.c]);
  if (net.kirim({ t: 's', v: st.tata.v, q: ++st.q, z, b })) { st.kotor = false; st.kirimTerakhir = now; }
}
function getar(pola) { try { navigator.vibrate && navigator.vibrate(pola); } catch (e) { /* tidak didukung */ } }

// ---------- gabung ----------
elKode.value = CoopNet.rapikanKode(decodeURIComponent(location.hash.slice(1)));
elKode.addEventListener('input', () => { elKode.value = CoopNet.rapikanKode(elKode.value); });
document.getElementById('tombolGabung').addEventListener('click', async () => {
  const kode = CoopNet.rapikanKode(elKode.value);
  if (!CoopNet.kodeSah(kode)) { elStatus.textContent = `Kode harus ${CoopNet.PANJANG_KODE} huruf/angka.`; return; }
  history.replaceState(null, '', location.pathname + location.search + '#' + kode);
  // layar penuh + kunci mendatar harus dipicu langsung oleh ketukan; gagal pun tidak apa-apa
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) { /* tidak didukung */ }
  try { await screen.orientation.lock('landscape'); } catch (e) { /* tidak didukung */ }
  mintaWakeLock();
  elGabung.style.display = 'none'; st.aktif = true;
  if (net) net.berhenti();
  net = CoopNet.pad(kode, {
    idPaksa,
    onStatus(s, info, diag) {
      st.status = s; st.pesanStatus = info || '';
      if (diag) st.diag = diag;
      if (s === 'tersambung') getar([20, 40, 20]);
    },
    onData(d) {
      if (d.t === 'tata') pasangTata(d);
      else if (d.t === 'i') st.info = d;
      else if (d.t === 'v') getar(d.pola || 40);
    },
  });
});
async function mintaWakeLock() { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* tidak didukung */ } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && st.aktif) mintaWakeLock(); });

// ---------- gambar ----------
function teks(s, x, y, ukuran, warna, rata = 'center', tebal = 700) {
  ctx.font = `${tebal} ${ukuran}px system-ui,sans-serif`; ctx.fillStyle = warna; ctx.textAlign = rata; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function lingkaran(x, y, r, warna, isi, garis, lebar = 3) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  if (isi != null) { ctx.globalAlpha = isi; ctx.fillStyle = warna; ctx.fill(); }
  if (garis != null) { ctx.globalAlpha = garis; ctx.strokeStyle = warna; ctx.lineWidth = lebar; ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function panah(x, y, ax, ay, dari, sampai) {
  const ex = x + ax * sampai, ey = y + ay * sampai, a = Math.atan2(ay, ax);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x + ax * dari, y + ay * dari); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(a - .5) * 14, ey - Math.sin(a - .5) * 14);
  ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(a + .5) * 14, ey - Math.sin(a + .5) * 14); ctx.stroke();
}

// Panel diagnosis selama belum tersambung: menunjukkan langkah mana yang macet.
const ICE_ID = { new: 'belum mulai', checking: 'mencoba…', connected: 'tersambung', completed: 'tersambung', failed: 'GAGAL', disconnected: 'terputus', closed: 'ditutup' };
function gambarDiag(cx, y0) {
  if (st.status === 'tersambung') return;
  const d = st.diag || {}, ok = '#7ee0a8', tunggu = '#ffc46b', buruk = '#ff6b6b';
  const baris = [];
  if (st.status === 'tidak-ada') baris.push([st.pesanStatus, buruk]);
  else if (st.status === 'galat') baris.push(['Galat: ' + st.pesanStatus, buruk]);
  baris.push([`1. Server perantara: ${d.perantara ? '✓' : 'menghubungi…'}`, d.perantara ? ok : tunggu]);
  if (d.perantara) baris.push([`2. Layar komputer ditemukan: ${d.layar ? '✓' : 'menunggu jawaban…'}`, d.layar ? ok : tunggu]);
  if (d.layar) baris.push([`3. Jalur langsung HP ↔ layar: ${ICE_ID[d.ice] || d.ice}`, d.ice === 'failed' ? buruk : tunggu]);
  if (d.perantara) baris.push([`alamat HP yang ditemukan: ${d.kandidat || '-'}`, '#9aa3c7']);
  if (d.gagal) {
    baris.push([`Jalur langsung gagal ${d.gagal}×, masih terus dicoba.`, buruk]);
    baris.push(['Penyebab umum: hotspot HP atau data seluler.', '#e8ebf7']);
    baris.push(['Sambungkan HP dan komputer ke WiFi router yang sama.', '#e8ebf7']);
  }
  const tinggi = baris.length * 22 + 20, lebar = Math.min(W - 24, 520);
  ctx.fillStyle = 'rgba(11,16,32,.92)'; ctx.strokeStyle = '#2a3358'; ctx.lineWidth = 1;
  ctx.fillRect(cx - lebar / 2, y0, lebar, tinggi); ctx.strokeRect(cx - lebar / 2, y0, lebar, tinggi);
  baris.forEach(([s, w], i) => teks(s, cx, y0 + 21 + i * 22, 14, w, 'center', 600));
}

function gambarKontrol(warnaPemain) {
  const s = sus();
  if (!s) { teks('Menunggu susunan kontrol dari layar…', W / 2, H / 2, 15, '#9aa3c7'); return; }
  const kiri = s.zona.some(z => z.sisi === 'kiri'), kanan = s.zona.some(z => z.sisi === 'kanan');
  if (kiri && kanan) { ctx.strokeStyle = 'rgba(154,163,199,.12)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(W / 2, ATAS); ctx.lineTo(W / 2, H); ctx.stroke(); }
  s.zona.forEach((zs, i) => {
    const z = st.zona[i], R = RZ(), warna = zs.jenis === 'stik' ? warnaPemain : (zs.warna || '#ff7a5c');
    if (z.id !== null) {
      const [kx, ky] = zs.jenis === 'stik' ? arahStik(z) : [z.ax, z.ay];
      lingkaran(z.ox, z.oy, R, warna, null, .6);
      lingkaran(z.ox + kx * R, z.oy + ky * R, R * .42, warna, .85, null);
      if (zs.jenis === 'arah' && (z.ax || z.ay)) panah(z.ox, z.oy, z.ax, z.ay, R, R * 1.7);
    } else {
      const p = pusatZona(zs);
      ctx.setLineDash([6, 8]); lingkaran(p.x, p.y, R, warna, null, .3, 2); ctx.setLineDash([]);
      teks(zs.label, p.x, p.y - 8, 14, warna);
      teks(zs.jenis === 'arah' ? 'ketuk · geser = bidik' : 'sentuh & geser', p.x, p.y + 12, 11, '#9aa3c7', 'center', 400);
    }
  });
  s.tombol.forEach((t, i) => {
    const p = posTombol(t), tahan = st.tombol[i].id !== null;
    lingkaran(p.x, p.y, p.r, t.warna, tahan ? .9 : .35, 1);
    teks(t.label, p.x, p.y, Math.max(11, p.r * .3), tahan ? '#0b1020' : '#fff');
  });
}

function gambar() {
  ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, W, H);
  if (!st.aktif) return;
  if (!mendatar()) {
    teks('⟳', W / 2, H * .18, 64, '#6c8dff');
    teks('Putar HP mendatar', W / 2, H * .18 + 60, 22, '#e8ebf7');
    teks('Kunci rotasi mati? Ketuk ⛶ di pojok setelah memutar.', W / 2, H * .18 + 92, 13, '#9aa3c7', 'center', 400);
    gambarDiag(W / 2, H * .18 + 120);
    return;
  }
  const warnaPemain = st.info ? st.info.warna : '#6c8dff', ok = st.status === 'tersambung';
  const ket = ok ? `P${st.info ? st.info.nomor : '?'}  ·  ping ${st.info && st.info.rtt != null ? Math.round(st.info.rtt) + ' ms' : '…'}`
    : st.status === 'menyambung' ? 'Menyambung…' : st.status === 'terputus' ? 'Terputus — menyambung ulang…'
    : st.status === 'gagal-jalur' ? 'Jalur langsung gagal — mencoba lagi…' : st.status === 'tidak-ada' ? 'Ruang tidak ditemukan' : 'Galat koneksi';
  ctx.fillStyle = ok ? warnaPemain : '#ffc46b'; ctx.globalAlpha = .18; ctx.fillRect(0, 0, W, ATAS); ctx.globalAlpha = 1;
  teks(ket, W / 2, ATAS / 2, 15, ok ? warnaPemain : '#ffc46b');
  teks('⛶', W - 22, ATAS / 2, 18, '#9aa3c7');
  gambarKontrol(warnaPemain);
  gambarDiag(W / 2, 46);
}
cv.addEventListener('click', e => { // tombol ⛶ di pojok kanan atas
  if (st.aktif && e.clientX > W - 44 && e.clientY < ATAS) {
    document.documentElement.requestFullscreen().then(() => screen.orientation.lock('landscape')).catch(() => {});
  }
});

function loop(now) { kirimStatus(now); gambar(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
